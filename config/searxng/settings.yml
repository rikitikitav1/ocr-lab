# a local metasearch for the stand's own lookups; JSON output, no rate limiter (one client: the worker)
use_default_settings: true
server:
  # the key comes from SEARXNG_SECRET in .env, never from this file
  limiter: false
  image_proxy: false
search:
  formats: [html, json]
  safe_search: 0
ui:
  default_locale: ""
