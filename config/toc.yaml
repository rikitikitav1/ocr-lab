# what the table-of-contents sources read; words are matched case-insensitively at the start of a line

# labelled parts and chapters ("Chapter 3", "ГЛАВА 3") numbering must find to be a book's toc when nothing else is
numbering_base_min: 3
whole_book_max_pages: 100   # a book this short without any contents is one chapter; a longer one fails as structure not recognised
contents:
  scan_head: 30          # book pages from the start searched for printed contents
  scan_tail: 30          # and from the end: many Russian books print the contents last
  min_lines: 3           # lines ending in a page number that make a page a contents page
  headings: [contents, table of contents, brief contents, содержание, оглавление, краткое содержание, зміст,
             inhalt, inhaltsverzeichnis, sommaire, table des matières, índice, indice, sommario, spis treści]
numbering:
  head_lines: 8          # a part or chapter label counts only among the first lines of a page (an epigraph may come first)
  max_chars: 120         # a numbered line longer than this is prose, not a heading
  part: [part, часть, частина, teil, partie, parte, część]
  chapter: [chapter, глава, розділ, kapitel, chapitre, capítulo, capitolo, rozdział]
labels:
  top_share: 0.2         # a chapter label (book knob toc.chapter_label) starts in this top share of a recognised page
