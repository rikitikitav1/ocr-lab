# every outside call goes through app/net.py: retried on these answers, then its host is set aside for a while
delays: [0.1, 0.5, 1.0]            # pause before each retry, seconds; three retries after the first try
retry_status: [403, 408, 425, 429, 500, 502, 503, 504]
inactive_seconds: 600              # a host that failed every retry is skipped this long, then tried again
# the stand's own services are retried but never set aside: a restarted converter must be reachable at once
never_inactive: [localhost, 127.0.0.1, converter-docling, converter-mineru, ollama, searxng, api, postgres]
