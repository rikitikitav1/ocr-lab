# how the chapter checks read the book; the checks report numbers, never a verdict
piece:
  # a page whose layer has fewer words is read as a picture (a cover, a full-page figure) and left out of the text shares
  layer_min_words: 20
  # a heading longer than this many words is a paragraph an engine took for a heading
  heading_max_words: 20
  # a paragraph at least this long met twice in one piece is counted as repeated
  repeated_min_chars: 120
  # word runs this long met once in the layer and once in the chapter anchor the order check
  order_run_words: 6
book:
  # a paragraph at least this long met in two chapters is text the chapters' page ranges took twice
  duplicate_min_chars: 120
  # how many chapters the report lists as the worst by each number
  worst_pieces: 5
