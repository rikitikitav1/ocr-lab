# a book's languages (ISO 639-1) mapped to Tesseract 4.1 data files kept in data/tessdata, mounted into Docling

source: https://github.com/tesseract-ocr/tessdata/raw/4.1.0/{code}.traineddata
# always given too: code, numbers and Latin names sit in books of every language
always: [eng]
codes:
  ar: [ara]
  be: [bel]
  bg: [bul]
  cs: [ces]
  da: [dan]
  de: [deu]
  el: [ell]
  en: [eng]
  es: [spa]
  fa: [fas]
  fi: [fin]
  fr: [fra]
  he: [heb]
  hi: [hin]
  hu: [hun]
  hy: [hye]
  it: [ita]
  ja: [jpn]
  ka: [kat]
  kk: [kaz]
  ko: [kor]
  lt: [lit]
  lv: [lav]
  nl: [nld]
  "no": [nor]
  pl: [pol]
  pt: [por]
  ro: [ron]
  ru: [rus]
  sk: [slk]
  sl: [slv]
  sr: [srp]
  sv: [swe]
  tr: [tur]
  uk: [ukr]
  uz: [uzb]
  vi: [vie]
  zh: [chi_sim, chi_tra]
