# web lookups: which sites the stand reads book cards from, and how far it goes
link_pages: 6          # pages fetched per book from links the book prints and the shop pages they lead to
search_pages: 8        # pages fetched per book from search results on book sites
search_results: 20     # search results considered per query
# book shops, platforms and catalogues; a card (schema.org Book/Product) is read only from these,
# plus the sites the book itself names on its title pages
book_domains:
  - leanpub.com
  - ridero.ru
  - mybook.ru
  - bookmate.ru
  - books.yandex.ru
  - litres.ru
  - livelib.ru
  - labirint.ru
  - bookvoed.ru
  - ozon.ru
  - wildberries.ru
  - fictionbook.ru
  - amazon.com
  - goodreads.com
  - openlibrary.org
  - nostarch.com
  - oreilly.com
  - manning.com
  - piter.com
  - dmkpress.com
  - bhv.ru
  - ranok.com.ua
  - yakaboo.ua
  - flammarion.com
# never fetched, wherever they are linked from
skip_domains:
  - twitter.com
  - x.com
  - linkedin.com
  - facebook.com
  - vk.com
  - t.me
  - youtube.com
  - github.com
  - disqus.com
  - fonts.googleapis.com
  - bootstrapcdn.com
# shops that put themselves into a card's publisher field; such a value is the seller, not the publisher
sellers: [ЛитРес, Litres, LitRes, Ozon, OZON, Озон, Wildberries, Лабиринт, Буквоед, Яндекс Книги, Bookmate, MyBook,
          Amazon, Amazon.com, Читай-город, Book24]
