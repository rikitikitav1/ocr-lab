x-gpu: &gpu
  resources:
    reservations:
      devices:
        - driver: cdi
          device_ids: ["nvidia.com/gpu=all"]
          capabilities: [gpu]

x-host-user: &host-user "${UID:-1000}:${GID:-1000}"

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://postgres@postgres:5432/postgres
  DATA_DIR: /data
  SHELF_DIR: /shelf
  CONVERTER_DOCLING_BASE_URL: http://converter-docling:5001
  CONVERTER_MINERU_BASE_URL: http://converter-mineru:5001
  OLLAMA_BASE_URL: http://ollama:11434
  SEARXNG_URL: http://searxng:8080
  PYTHONDONTWRITEBYTECODE: "1"

x-app-volumes: &app-volumes
  - .:/app
  - ./data:/data
  - ../rag-lab/datasets/inbox/books:/shelf/books:ro
  - ../rag-lab/datasets/converter_gold:/shelf/gold:ro

services:
  postgres:
    # the pgvector build of PostgreSQL 17 rag-lab already pulled; ocr-lab uses no extension of it
    image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
    pull_policy: never
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pg_data:/var/lib/postgresql/data

  dbmate:
    image: ghcr.io/amacneil/dbmate:2.34.1@sha256:3298bdfcb651af608e06d2e13ae12398c4056e5326d38ef31885973d83248d9c
    pull_policy: never
    command: ["up"]
    user: *host-user
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://postgres@postgres:5432/postgres?sslmode=disable"
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db:/db

  api:
    build:
      dockerfile: Dockerfile
    command: ["uvicorn", "server:app", "--app-dir", "app", "--host", "0.0.0.0", "--port", "8100",
              "--reload", "--reload-dir", "app", "--reload-dir", "config"]
    user: *host-user
    env_file:
      - path: .env
        required: false
    environment: *app-env
    ports:
      - "127.0.0.1:8100:8100"
    depends_on:
      dbmate:
        condition: service_completed_successfully
    volumes: *app-volumes

  worker:
    build:
      dockerfile: Dockerfile
    command: ["python", "app/worker.py"]
    # a native crash in a PDF library must not stop the queue; a restart requeues the held job
    restart: unless-stopped
    user: *host-user
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      HOME: /tmp
    depends_on:
      dbmate:
        condition: service_completed_successfully
    volumes: *app-volumes

  # local metasearch: title and author in, result links out; the stand reads book cards from those links
  searxng:
    image: searxng/searxng@sha256:76b0bf285aca014c7191fc4d9234c4bfb358624ac33d8883833d496c059ec072
    pull_policy: never
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    volumes:
      # read-only: the container chowned a writable mount to its own user
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro

  ollama:
    image: ollama/ollama@sha256:57f573b47f1f71ebb445789f279fe3e596a8beab182f7cf486db9205bad87c5a
    pull_policy: never
    healthcheck:
      test: ["CMD", "ollama", "list"]
      start_period: 60s
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - rag-lab_ollama_data:/root/.ollama
    deploy: *gpu

  # each converter image carries its models and a supervisor that holds the card only on request
  converter-docling: &converter
    profiles: ["convert"]
    image: rag-lab-converter-docling
    pull_policy: never
    init: true
    stop_grace_period: 45s
    environment:
      DOCLING_SERVE_ENABLE_UI: "0"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20
    deploy: *gpu

  converter-mineru:
    <<: *converter
    image: rag-lab-converter-mineru
    environment: {}

volumes:
  pg_data:
  rag-lab_ollama_data:
    external: true
