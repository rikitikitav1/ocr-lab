name: CI

# a branch with a pull request is run by the pull_request event alone, so one push runs the checks once
on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check app/ tests/ scripts/

  test:
    runs-on: ubuntu-latest
    # the database tests build a throwaway base from db/schema.sql; without postgres they are skipped
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --all-groups
      # a skipped database test would pass for the wrong reason, so the run fails if any is skipped
      # bash with pipefail, so a failing test fails the step and not only tee's exit code counts
      - run: uv run pytest -q -n 4 -rs | tee pytest.log
        shell: bash
      - run: "! grep -q SKIPPED pytest.log"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5

      # SAST over our own code, fails on medium+ severity
      - name: bandit (SAST)
        run: uvx bandit -r app/ -ll -c pyproject.toml

      # dependency CVEs, blocking
      - name: pip-audit (dependencies)
        run: |
          uv export --no-hashes --no-emit-project --format requirements-txt -o requirements.txt
          uvx pip-audit -r requirements.txt

      # secret scan across the full history; the CLI, because the action asks for the parent of a root commit
      - name: gitleaks (secrets)
        run: docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.24.3 detect --source /repo --no-banner --redact
