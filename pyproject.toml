[project]
name = "ocr-lab"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "fastmcp>=2.0",
    "python-multipart",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "pydantic>=2",
    "pyyaml>=6",
    "structlog",
    "httpx",
    "openai>=2",
    "pypdfium2>=4.30",
    "rapidfuzz",
    "lingua-language-detector",
    "wordfreq",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.16", "reportlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app", "."]
markers = ["stand: needs the running compose stand"]
addopts = "-m 'not stand'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["app"]
sources = ["app"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E5", "E7", "E9", "F", "I", "B"]

[tool.bandit]
# raw SQL in job_queue and net uses bound parameters; the only interpolated parts are code-controlled names
skips = ["B608"]
